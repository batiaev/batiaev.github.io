    <!--
      Theme and sidebar state, applied before first paint so neither flashes.
      Storage can throw (private windows, blocked site data); the defaults are
      then the system theme and an open sidebar.
    -->
    <script>
      (function () {
        var root = document.documentElement;
        var theme = "system";
        try {
          theme = localStorage.getItem("theme") || "system";
          if (localStorage.getItem("sidebar") === "collapsed") root.setAttribute("data-sidebar", "collapsed");
        } catch (e) {}
        var dark = theme === "dark" || (theme !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
